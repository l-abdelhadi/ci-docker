name: CI - Test, Coverage, Docker Build & Run

on:
  push:
  pull_request:

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 4. Run unit tests with coverage
      - name: Run tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      # 5. Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: docker build -t flask-ci-docker .

      # 3. Run container in background
      - name: Run container
        run: docker run -d -p 5000:5000 --name flask-container flask-ci-docker

      # 4. Wait for container to be ready
      - name: Wait for container
        run: sleep 5

      # 5. Verify container response
      - name: Test container response
        run: curl http://localhost:5000

      # 6. Show container logs (optional)
      - name: Show container logs
        run: docker logs flask-container

      # 7. Stop & remove container
      - name: Clean up
        run: docker rm -f flask-container
